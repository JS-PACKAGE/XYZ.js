name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} quality / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        os: [ubuntu-24.04, windows-11-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          # Keep reviewed/vendor bytes intact without changing global Git config.
          GIT_CONFIG_COUNT: ${{ runner.os == 'Windows' && '1' || '0' }}
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Restore the pnpm store (content-verified by the frozen lockfile)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Point pnpm and Playwright at the restored caches
        run: |
          echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
      - run: npx --yes pnpm@12.6.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.6.0 run format:check
      - run: npx --yes pnpm@12.6.0 run typecheck
      - run: npx --yes pnpm@12.6.0 run lint
      - run: npx --yes pnpm@12.6.0 run test
      - run: npx --yes pnpm@12.6.0 run build
      - name: Verify versioned public declarations and supported consumers
        run: npx --yes pnpm@12.6.0 run check:api-compatibility
      - name: Reject representative breaking declarations without mutating sources
        run: node scripts/check-api-compatibility.mjs --negative-smoke
      - name: Verify approved archives under clean and polluted workspaces
        run: npx --yes pnpm@12.6.0 run check:package-hygiene
      - name: Preserve declaration and package-content evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            .vite/api-compatibility/
            .vite/package-hygiene/
          include-hidden-files: true
          if-no-files-found: warn

  browser:
    name: ${{ matrix.engine }} / Node ${{ matrix.node }} / ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        engine: [chromium, firefox, webkit]
        os: [ubuntu-24.04]
        include:
          - os: macos-latest
            engine: webkit
            node: '26'
          - os: windows-11-arm
            engine: chromium
            node: '26'
          - os: windows-11-arm
            engine: firefox
            node: '26'
          - os: windows-11-arm
            engine: webkit
            node: '26'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          # Keep reviewed/vendor bytes intact without changing global Git config.
          GIT_CONFIG_COUNT: ${{ runner.os == 'Windows' && '1' || '0' }}
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Restore the pnpm store (content-verified by the frozen lockfile)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore the pinned Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ matrix.engine }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Point pnpm and Playwright at the restored caches
        run: |
          echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - run: npx --yes pnpm@12.6.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.6.0 run build
      - name: Install the pinned Playwright engine and system prerequisites
        # On Windows, --with-deps only runs Playwright's ~3 minute install_media_pack.ps1 for Chromium.
        run: npx --yes pnpm@12.6.0 exec playwright-core install ${{ runner.os != 'Windows' && '--with-deps' || '' }} ${{ matrix.engine }}
      - name: Provide Firefox with a native headless audio output
        if: matrix.os == 'ubuntu-24.04' && matrix.engine == 'firefox'
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=xyz_ci
          pactl set-default-sink xyz_ci
          pactl info
      - name: Inspect and start existing Windows audio services
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('AudioEndpointBuilder', 'AudioSrv')) {
            Set-Service -Name $name -StartupType Manual
            Start-Service -Name $name
          }
          New-Item -ItemType Directory -Force .vite/windows-host | Out-Null
          @{
            services = @(Get-Service AudioEndpointBuilder,AudioSrv | Select-Object Name,Status)
            soundDevices = @(Get-CimInstance Win32_SoundDevice | Select-Object Name,Status,Manufacturer)
            endpoints = @(Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Select-Object FriendlyName,Status)
          } | ConvertTo-Json -Depth 5 | Tee-Object -FilePath .vite/windows-host/audio.json
      - name: Install verified signed audio on the ephemeral Windows runner
        # The pinned Pack45 contains a signed native driver for x64 and ARM64.
        if: runner.os == 'Windows' && (runner.arch == 'X64' || runner.arch == 'ARM64')
        shell: pwsh
        timeout-minutes: 6
        env:
          XYZ_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/setup-windows-audio.ps1
      - name: Smoke built-root examples on explicit Canvas2D
        if: success() || (failure() && runner.os == 'Windows')
        run: |
          npx --yes pnpm@12.6.0 run smoke:examples --browser ${{ matrix.engine }} --example gameplay2d --renderer canvas2d
          npx --yes pnpm@12.6.0 run smoke:examples --browser ${{ matrix.engine }} --example rendering2d --renderer canvas2d
      - name: Preserve mandatory Chromium native example gates
        if: matrix.engine == 'chromium' && (success() || (failure() && runner.os == 'Windows'))
        run: |
          npx --yes pnpm@12.6.0 run smoke:examples --browser chromium --example gameplay2d --renderer webgl2
          npx --yes pnpm@12.6.0 run smoke:examples --browser chromium --example rendering2d --renderer webgl2
      - name: Deep native pixel and lifecycle regressions without retries
        id: deep-native
        if: success() || (failure() && runner.os == 'Windows')
        # Windows hosted Chromium (ANGLE D3D11-WARP trap) and WebKit (ImageBitmap PNG decode) are
        # recorded, not gating: this is not Windows physical-device certification.
        continue-on-error: ${{ runner.os == 'Windows' && matrix.engine != 'firefox' }}
        env:
          DEBUG: pw:browser
        run: npx --yes pnpm@12.6.0 run regression:browser --browser ${{ matrix.engine }} ${{ matrix.engine == 'chromium' && '--require-webgpu' || '' }}
      - name: Report non-blocking Windows native regression failure
        if: steps.deep-native.outcome == 'failure' && runner.os == 'Windows'
        run: echo "::warning title=Windows ${{ matrix.engine }} native regression failed (non-blocking)::See the uploaded browser-regression artifact; Windows hosted results are not certification."
      - name: Desktop native interaction and reload
        if: success() || (failure() && runner.os == 'Windows')
        run: node scripts/platform-browser.mjs --browser ${{ matrix.engine }}
      - name: Separately labeled mobile viewport and touch emulation
        if: success() || (failure() && runner.os == 'Windows')
        run: node scripts/platform-browser.mjs --browser ${{ matrix.engine }} --mode mobile-emulation
      - name: Retained bidi and grapheme editing pixel proofs
        if: success() || (failure() && runner.os == 'Windows')
        run: npx --yes pnpm@12.6.0 run smoke:text --browser ${{ matrix.engine }}
      - name: Preserve measured engine reports and pixel proofs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.os }}-${{ matrix.engine }}-node-${{ matrix.node }}
          path: |
            .vite/browser-regression/
            .vite/platform-browser/
            .vite/example-smoke/
            .vite/text-layout/
            .vite/windows-host/
          include-hidden-files: true
          if-no-files-found: warn

  windows-chromium-gpu-diagnostic:
    name: Windows Chromium owned GPU native exception capture (diagnostic)
    # Manual only: it deliberately reproduces a known failure and uploads a large full-memory dump.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      XYZ_CHROMIUM_NATIVE_CAPTURE: approved-owned-gpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - run: npx --yes pnpm@12.6.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.6.0 run build
      - name: Install the pinned Playwright Chromium
        run: npx --yes pnpm@12.6.0 exec playwright-core install --with-deps chromium
      - name: Acquire and verify official signed ProcDump
        shell: pwsh
        run: ./scripts/windows-chromium-crash.ps1 -Phase setup
      - name: Reproduce the unchanged WebGL2 regression with owned GPU capture
        shell: bash
        env:
          DEBUG: pw:browser
        # Browser stderr (GPU service GL call log) is large; keep it as an artifact, not job log.
        run: |
          mkdir -p .vite/browser-regression-native-capture/chromium
          npx --yes pnpm@12.6.0 run regression:browser --browser chromium --renderer webgl2 --output .vite/browser-regression-native-capture/chromium 2> .vite/browser-regression-native-capture/chromium/browser-stderr.log
      - name: Preserve native dump inventory and identity records
        if: always()
        shell: pwsh
        run: ./scripts/windows-chromium-crash.ps1 -Phase collect
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-chromium-owned-gpu-diagnostic
          path: |
            .vite/browser-regression-native-capture/
            .vite/windows-host/
          include-hidden-files: true
          if-no-files-found: warn

  deployed-site:
    name: Deployed site / macOS owned Chromium / shard ${{ matrix.shard }} of 4
    # Native Metal host scope; unchanged workloads/timeouts, not a Linux or FPS claim.
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Restore the pnpm store (content-verified by the frozen lockfile)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore the pinned Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Point pnpm and Playwright at the restored caches
        run: |
          echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - run: npx --yes pnpm@12.6.0 install --frozen-lockfile
      - name: Build this runner's complete static deployment
        run: npx --yes pnpm@12.6.0 run build:site
      - name: Install this shard's owned native browser
        run: npx --yes pnpm@12.6.0 exec playwright-core install --with-deps chromium
      - name: Provide an inaudible native audio device
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=xyz_site_shard_${{ matrix.shard }}
          pactl set-default-sink xyz_site_shard_${{ matrix.shard }}
          pactl set-sink-volume xyz_site_shard_${{ matrix.shard }} 0%
          pactl info
      - name: Smoke every assigned deployed example and both complete catalogues
        run: npx --yes pnpm@12.6.0 run smoke:site --shard ${{ matrix.shard }}/4 --output .vite/site-smoke/shard-${{ matrix.shard }}-of-4
      - name: Preserve this shard's ordered coverage and visible evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployed-site-node-26-shard-${{ matrix.shard }}-of-4
          path: .vite/site-smoke/shard-${{ matrix.shard }}-of-4/
          include-hidden-files: true
          if-no-files-found: warn

  release-surfaces:
    name: Production workload and API compatibility / macOS owned Chromium
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Restore the pnpm store (content-verified by the frozen lockfile)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore the pinned Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Point pnpm and Playwright at the restored caches
        run: |
          echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - run: npx --yes pnpm@12.6.0 install --frozen-lockfile
      - name: Build the release package
        run: npx --yes pnpm@12.6.0 run build
      - name: Preserve the supported 1.x source consumer contract
        run: node scripts/check-api-compatibility.mjs
      - name: Install one owned native browser
        run: npx --yes pnpm@12.6.0 exec playwright-core install --with-deps chromium
      - name: Enforce host-scoped production frame, hitch and lifecycle budgets
        if: success() || failure()
        # Explicit initial operator policy, not repeated hosted calibration or a universal FPS guarantee.
        run: npx --yes pnpm@12.6.0 run benchmark:production --renderer webgl2 --presentation native-foreground --profile benchmarks/production/hosted-macos-webgl2.policy.json --limit operations.teardownWallMs=5000
      - name: Reject genuine foreground interruptions while retaining measurements
        if: success() || failure()
        run: node scripts/check-production-foreground.mjs
      - name: Preserve release surface reports, screenshots and install/build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-surfaces-node-26
          path: |
            .vite/production-workloads/
            .vite/production-focus-guard/
            .vite/api-compatibility/
          include-hidden-files: true
          if-no-files-found: warn

  starter-games:
    name: Installed ${{ matrix.template }} starter / macOS owned Chromium
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template: ['2d', '3d']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Restore the pnpm store (content-verified by the frozen lockfile)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore the pinned Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Point pnpm and Playwright at the restored caches
        run: |
          echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - run: npx --yes pnpm@12.6.0 install --frozen-lockfile
      - name: Build the release package
        run: npx --yes pnpm@12.6.0 run build
      - name: Install one owned native browser
        run: npx --yes pnpm@12.6.0 exec playwright-core install --with-deps chromium
      - name: Pack, install, deploy and play the independent ${{ matrix.template }} starter game
        run: node scripts/starter-smoke.mjs --template ${{ matrix.template }} --output .vite/starter-smoke/${{ matrix.template }}
      - name: Preserve the starter report, screenshots and install/build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starter-games-node-26-${{ matrix.template }}
          path: .vite/starter-smoke/${{ matrix.template }}/
          include-hidden-files: true
          if-no-files-found: warn

  release-audio:
    name: Native concurrent audio / Linux owned Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Restore the pnpm store (content-verified by the frozen lockfile)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore the pinned Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Point pnpm and Playwright at the restored caches
        run: |
          echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - run: npx --yes pnpm@12.6.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.6.0 run build
      - run: npx --yes pnpm@12.6.0 exec playwright-core install --with-deps chromium
      - name: Preserve the original inaudible native Linux audio device
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=xyz_release_audio
          pactl set-default-sink xyz_release_audio
          pactl set-sink-volume xyz_release_audio 0%
          pactl info
      - name: Exercise muted native concurrent audio and owned teardown
        run: npx --yes pnpm@12.6.0 run audio:native-load --browser chromium --concurrency 2
      - name: Preserve native signal, reference and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-audio-node-26
          path: .vite/audio-native-load/
          include-hidden-files: true
          if-no-files-found: warn
