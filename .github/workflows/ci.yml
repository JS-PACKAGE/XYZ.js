name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - run: npx --yes pnpm@12.6.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.6.0 run format:check
      - run: npx --yes pnpm@12.6.0 run typecheck
      - run: npx --yes pnpm@12.6.0 run lint
      - run: npx --yes pnpm@12.6.0 run test
      - run: npx --yes pnpm@12.6.0 run build
