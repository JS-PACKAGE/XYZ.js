name: Diagnose v1.18 site
on:
  push:
    branches: [diagnostic-v118-site]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - run: npx --yes pnpm@12.6.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.6.0 run build:site
      - run: npx --yes pnpm@12.6.0 exec playwright-core install --with-deps chromium
      - run: node scripts/diagnose-site.mjs
        env:
          XYZ_DIAGNOSTIC_CHANNEL: chromium
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-site-diagnostics
          path: .vite/site-diagnostic/
          include-hidden-files: true
