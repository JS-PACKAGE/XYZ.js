name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - run: npx --yes pnpm@12.6.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.6.0 run build
      - name: Pack release archive
        run: npx --yes pnpm@12.6.0 pack --pack-destination release-assets
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum *.tgz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" release-assets/*.tgz release-assets/SHA256SUMS --verify-tag --generate-notes
