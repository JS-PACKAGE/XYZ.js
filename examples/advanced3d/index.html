<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XYZ.js · Advanced 3D</title>
    <style>
      body {
        margin: 2rem;
        background: #101724;
        color: #d9edff;
        font: 16px system-ui;
      }
      canvas {
        display: block;
        width: min(100%, 960px);
        aspect-ratio: 16 / 9;
        touch-action: none;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin: 1rem 0;
      }
      button,
      select {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Advanced 3D</h1>
    <p>
      Drag to orbit, right-drag to pan, scroll to zoom. Click a mesh to pick it.
    </p>
    <div class="controls">
      <label
        >Backend
        <select id="backend">
          <option>webgpu</option>
          <option>webgl2</option>
          <option>canvas2d</option>
          <option>auto</option>
        </select></label
      >
      <label
        >Camera
        <select id="camera">
          <option value="perspective">Perspective</option>
          <option value="orthographic">Orthographic</option>
        </select></label
      >
      <label><input id="shadows" type="checkbox" checked /> Shadows</label>
      <label><input id="post" type="checkbox" /> HDR / ACES / bloom</label>
      <label
        ><input id="environment" type="checkbox" /> Environment IBL + sky</label
      >
      <label><input id="fog" type="checkbox" /> Fog</label>
      <button id="pause">Pause</button>
      <button id="destroy">Destroy</button>
    </div>
    <canvas id="game"></canvas>
    <p id="status" role="status">Loading…</p>
    <p id="pick" role="status">No selection</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
