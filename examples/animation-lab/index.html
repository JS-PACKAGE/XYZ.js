<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XYZ.js · Animation lab</title>
    <style>
      body {
        margin: 2rem;
        background: #101724;
        color: #d9edff;
        font: 16px system-ui;
      }
      canvas {
        display: block;
        width: min(100%, 800px);
        aspect-ratio: 16 / 9;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        margin: 1rem 0;
      }
      #state {
        font-variant-numeric: tabular-nums;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <h1>Animation lab</h1>
    <p>
      The cube is driven by an <code>AnimationStateMachine</code>: raising the
      speed parameter cross-fades idle → run, the Jump trigger plays a
      non-looping clip and returns to idle on its exit time. The sphere is
      animated by a <code>Timeline</code> of <code>Tween</code>s on
      <code>scene.tweens</code>.
    </p>
    <div class="controls">
      <label
        >Renderer
        <select id="backend">
          <option value="auto">Auto</option>
          <option value="webgpu">WebGPU</option>
          <option value="webgl2">WebGL2</option>
          <option value="canvas2d">Canvas2D (no 3D)</option>
        </select></label
      >
      <label
        >Speed
        <input id="speed" type="range" min="0" max="1" step="0.05" value="0" />
        <output id="speed-value">0.00</output></label
      >
      <button id="jump" type="button">Jump (trigger)</button>
      <button id="pulse" type="button">Pulse sphere (timeline)</button>
    </div>
    <canvas id="game" aria-label="Animation state machine demo"></canvas>
    <p id="state" aria-live="off">Loading…</p>
    <p id="status" role="status">Loading…</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
