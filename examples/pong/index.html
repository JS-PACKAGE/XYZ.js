<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XYZ.js · Pong</title>
    <style>
      body {
        margin: 2rem;
        background: #101724;
        color: #d9edff;
        font: 16px system-ui;
      }
      canvas {
        display: block;
        width: min(100%, 800px);
        aspect-ratio: 16 / 9;
        touch-action: none;
      }
      #status {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <h1>Pong</h1>
    <p>Move with ↑ / ↓, drag on the canvas, or use a gamepad.</p>
    <canvas id="game"></canvas>
    <p id="status" role="status">Loading…</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
