<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XYZ.js · PBR3D</title>
    <style>
      body {
        margin: 2rem;
        background: #101724;
        color: #d9edff;
        font: 16px system-ui;
      }
      canvas {
        display: block;
        width: min(100%, 960px);
        aspect-ratio: 16 / 9;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem 1.5rem;
        max-width: 960px;
        margin: 1rem 0;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      input[type='range'] {
        width: 110px;
      }
    </style>
  </head>
  <body>
    <h1>PBR3D</h1>
    <p>
      Metalness increases left → right; roughness increases bottom → top. Drag
      to orbit and scroll to zoom. Compare directional shadows, a movable orange
      point light, procedural environment lighting, distance fog, and HDR
      exposure/bloom.
    </p>
    <canvas id="game"></canvas>
    <div class="controls">
      <label
        ><input id="shadows" type="checkbox" checked /> Directional
        shadows</label
      >
      <label
        ><input id="directional" type="checkbox" checked /> Directional
        light</label
      >
      <label><input id="point" type="checkbox" checked /> Point light</label>
      <label
        ><input id="cubemap" type="checkbox" /> Six-face cubemap
        environment</label
      >
      <label
        ><input id="animate" type="checkbox" checked /> Animate light
        angle</label
      >
      <label for="angle"
        >Light angle
        <input id="angle" type="range" min="-180" max="180" value="35"
      /></label>
      <label for="point-x"
        >Point X
        <input id="point-x" type="range" min="-6" max="6" step="0.1" value="-3"
      /></label>
      <label for="exposure"
        >Exposure
        <input
          id="exposure"
          type="range"
          min="0.1"
          max="3"
          step="0.05"
          value="1"
      /></label>
      <label for="bloom"
        >Bloom
        <input id="bloom" type="range" min="0" max="2" step="0.05" value="0.3"
      /></label>
      <label for="fog"
        >Fog density
        <input id="fog" type="range" min="0" max="0.12" step="0.005" value="0"
      /></label>
      <label for="environment"
        >Environment intensity
        <input
          id="environment"
          type="range"
          min="0"
          max="3"
          step="0.05"
          value="0.8"
      /></label>
      <label><input id="vignette" type="checkbox" /> 3D vignette effect</label>
      <label><input id="fxaa" type="checkbox" /> FXAA</label>
      <label><input id="ssao" type="checkbox" /> SSAO</label>
      <label><input id="dof" type="checkbox" /> Depth of field</label>
      <label
        >Focus depth
        <input id="focus" type="range" min="1" max="30" step="0.5" value="18"
      /></label>
    </div>
    <p id="readout" aria-live="polite"></p>
    <p id="status" role="status">Loading…</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
