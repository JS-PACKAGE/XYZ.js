<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transactional scene hot reload</title>
  </head>
  <body style="background: #131923; color: #eef; font-family: system-ui">
    <h1>Transactional scene hot reload</h1>
    <p id="status">Preparing scene…</p>
    <button id="reject">Reject candidate</button>
    <button id="dispose">Dispose Game</button>
    <p>
      Edit scene.ts for code HMR. For real assets run
      <code>node scripts/asset-hot-reload.mjs</code>, open its printed URL, then
      edit the authored PNG or atlas JSON. The watcher publishes immutable
      generation URLs; rejected candidates keep the old scene and pixels.
    </p>
    <canvas id="game" width="800" height="450"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
