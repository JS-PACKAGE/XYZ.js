<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Native render graph — XYZ.js</title>
    <style>
      body {
        background: #101421;
        color: #eee;
        font: 16px system-ui;
        margin: 2rem;
      }
      canvas {
        max-width: 100%;
        border: 1px solid #667;
      }
    </style>
  </head>
  <body>
    <h1>Native render graph</h1>
    <p>
      A resource-scheduled diamond, not a linear callback chain. Both WGSL and
      GLSL are authored directly.
    </p>
    <label
      >Blue attachment amount
      <input id="amount" type="range" min="0" max="1" value="1" step="0.01"
    /></label>
    <p id="status">Preparing native passes…</p>
    <canvas id="game"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
