<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XYZ.js — Sprite</title>
    <style>
      body {
        margin: 24px;
        background: #101827;
        color: #eef2ff;
        font-family: system-ui;
      }
      canvas {
        display: block;
        width: min(100%, 640px);
        aspect-ratio: 16 / 9;
        border: 1px solid #718096;
      }
      button {
        margin: 12px 8px 0 0;
        padding: 8px 14px;
      }
    </style>
  </head>
  <body>
    <h1>Texture &amp; Sprite</h1>
    <p>
      Two sprites share one texture. Change their order and opacity to inspect
      overlap.
    </p>
    <canvas id="game"></canvas>
    <button id="order" disabled>Swap draw order</button>
    <button id="opacity" disabled>Toggle opacity</button>
    <p id="status" role="status">Loading</p>
    <button id="audio" disabled>Enable audio and play six-voice music</button>
    <button id="sfx" disabled>Play four SFX</button>
    <button id="stop-audio" disabled>Stop audio</button>
    <p id="audio-status" role="status">
      Audio locked — no AudioContext is created before the first gesture.
    </p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
