<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Narrative director</title>
    <style>
      body {
        font: 16px system-ui;
        background: #172032;
        color: #eef;
        margin: 24px;
      }
      button,
      input {
        margin: 6px;
        padding: 8px;
      }
      #stage {
        height: 70px;
        background: #293950;
        overflow: hidden;
      }
      #courier {
        width: 90px;
        padding: 12px;
        background: #5682b8;
      }
      canvas {
        width: 320px;
        height: 80px;
      }
      #choices {
        min-height: 50px;
      }
    </style>
  </head>
  <body>
    <h1>Courier story</h1>
    <p>
      A simulation-time camera cutscene pauses for a branching conversation.
      Deliver two parcels to unlock the return quest. Save and restore never
      repeat rewards.
    </p>
    <canvas id="game"></canvas>
    <div id="stage"><div id="courier">Courier</div></div>
    <p id="dialogue">The courier is approaching.</p>
    <div id="choices"></div>
    <button id="pause">Pause / resume</button
    ><button id="cancel">Cancel cutscene</button
    ><label
      >Seek <input id="seek" type="range" min="0" max="6" step="0.1" value="0"
    /></label>
    <button id="parcel">Deliver parcel</button
    ><button id="home">Return home</button><button id="save">Save</button
    ><button id="restore">Restore</button>
    <pre id="status"></pre>
    <p id="error" role="alert"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
