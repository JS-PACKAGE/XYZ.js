<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Material reference qualification</title>
  </head>
  <body>
    <canvas id="game" width="128" height="128"></canvas>
    <pre id="report" data-state="running"></pre>
    <script type="module">
      import { renderMaterialReferences } from './material-reference.ts';

      const parameters = new URLSearchParams(location.search);
      const output = document.querySelector('#report');
      const renderer = parameters.get('renderer');
      try {
        const report = await renderMaterialReferences(
          document.querySelector('#game'),
          renderer,
          parameters.get('perturb') === '1',
        );
        output.textContent = JSON.stringify(report);
        output.dataset.state = report.error ? 'failed' : 'passed';
      } catch (error) {
        output.textContent = JSON.stringify({
          renderer,
          scenarios: [],
          error: String(error),
        });
        output.dataset.state = 'failed';
      }
    </script>
  </body>
</html>
